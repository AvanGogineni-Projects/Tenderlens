# Local runs only (the Databricks job generates its own profile). Values come from the environment:
#   DBT_HOST, DBT_HTTP_PATH, DBT_TOKEN (e.g. `databricks auth token`), DBT_SCHEMA
tenderlens:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH') }}"
      token: "{{ env_var('DBT_TOKEN') }}"
      catalog: workspace
      schema: "{{ env_var('DBT_SCHEMA') }}"
      threads: 4
