bundle:
  name: tenderlens

variables:
  catalog:
    default: workspace
  schema:
    default: tenderlens
  warehouse_id:
    lookup:
      warehouse: Serverless Starter Warehouse

artifacts:
  wheel:
    type: whl
    path: .
    build: python3 -m pip wheel --no-deps -w dist .

resources:
  schemas:
    tenderlens:
      catalog_name: ${var.catalog}
      name: ${var.schema}

  volumes:
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.tenderlens.name}
      name: raw
      comment: TED daily packages as downloaded (tar.gz), the replayable source of truth.

  pipelines:
    bronze:
      name: tenderlens-lakehouse  # bronze + silver
      catalog: ${var.catalog}
      schema: ${resources.schemas.tenderlens.name}
      serverless: true
      channel: CURRENT
      root_path: ./src
      libraries:
        - file:
            path: ./src/tenderlens/pipelines/bronze.py
        - file:
            path: ./src/tenderlens/pipelines/silver.py
      configuration:
        spark.sql.execution.arrow.maxRecordsPerBatch: "1000"  # notices are ~30 KB of XML each
        tenderlens.raw_path: /Volumes/${var.catalog}/${resources.schemas.tenderlens.name}/raw/ted/daily

  jobs:
    daily:
      name: tenderlens-daily
      schedule:
        quartz_cron_expression: "0 0 9 * * ?"  # TED publishes overnight; paused automatically in dev
        timezone_id: Europe/Stockholm
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - ./dist/*.whl
        - environment_key: dbt
          spec:
            client: "3"
            dependencies:
              - dbt-databricks>=1.10,<2
      tasks:
        - task_key: ingest
          environment_key: default
          max_retries: 2
          python_wheel_task:
            package_name: tenderlens
            entry_point: tenderlens-ingest
            parameters: ["--volume", "/Volumes/${var.catalog}/${resources.schemas.tenderlens.name}/raw/ted"]
        - task_key: bronze
          depends_on:
            - task_key: ingest
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze.id}
        - task_key: gold
          depends_on:
            - task_key: bronze
          environment_key: dbt
          dbt_task:
            project_directory: ./dbt
            commands: ["dbt build"]  # seeds, models and tests; a failing test fails the run
            warehouse_id: ${var.warehouse_id}
            catalog: ${var.catalog}
            schema: ${resources.schemas.tenderlens.name}

targets:
  dev:
    mode: development
    default: true
