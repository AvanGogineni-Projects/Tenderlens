<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tenderlens shows who wins Swedish public contracts, at what price, and which contracts are ending — so you know which tenders are coming next." />
    <meta name="theme-color" content="#0D1014" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230D1014'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='%23B9F26B' stroke-width='3'/%3E%3Cpath d='M19 19l6 6' stroke='%23B9F26B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Tenderlens — Swedish public contracts</title>
    <script>
      // Apply the saved theme before first paint, so light mode never flashes dark.
      try {
        const t = localStorage.getItem('tenderlens_theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
