[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderlens"
version = "0.0.1"
description = "Public-procurement intelligence on Databricks from TED eForms notices"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
# the API locally; Vercel installs requirements.txt
api = ["fastapi>=0.115", "psycopg-pool>=3.2", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2", "dbt-databricks>=1.10,<2", "httpx>=0.27"]

[project.scripts]
tenderlens-ingest = "tenderlens.ingest:main"
tenderlens-export = "tenderlens.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
